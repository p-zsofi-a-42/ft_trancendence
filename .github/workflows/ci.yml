name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
      TOKEN_SECRET: ci-only-token-secret
      NUXT_SESSION_PASSWORD: ci-only-session-password-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
    
    # testing the build
      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production images
        run: docker compose build web user

      - name: Build development images
        run: docker compose --profile dev build web-dev user-dev
    
    #running tests
