services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5

  game-db:
    container_name: game_db
    image: postgres:16
    environment:
      POSTGRES_USER: ${GAME_DB_USER}
      POSTGRES_PASSWORD: ${GAME_DB_PASSWORD}
      POSTGRES_DB: ${GAME_DB_NAME}
    volumes:
      - game_data:/var/lib/game/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$GAME_DB_USER -d $$GAME_DB_NAME"]
      interval: 5s
      retries: 5

  user:
    build: ./services/user
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TOKEN_SECRET: ${TOKEN_SECRET}
      REDIS_URL: redis://redis:6379
    # No ports: only the web service can reach it, on the Compose network.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./web
    # Environment variables for the Nuxt web service. Need the 'NUXT_' prefix 
    # to be recognized by Nuxt.
    environment:
      NUXT_USER_SERVICE_URL: http://user:4000
      NUXT_GAME_SERVICE_URL: http://game:5005
      NUXT_TOKEN_SECRET: ${TOKEN_SECRET}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      NUXT_REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      user:
        condition: service_started
      redis:
        condition: service_healthy

  # Redis service for pub/sub and caching
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  game:
    build: ./services/game
    image: game
    environment:
      DATABASE_URL: postgres://${GAME_DB_USER}:${GAME_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TOKEN_SECRET: ${TOKEN_SECRET}
    # No ports: only the web service can reach it, on the Compose network.
    depends_on:
      postgres:
        condition: service_healthy

  # Dev variant of the game service with hot-reload: `docker compose --profile dev up game-dev`.
  game-dev:
    build:
      target: dev
      context: ./services/game
    container_name: game_dev
    image: game_dev
    environment:
      DATABASE_URL: postgresql://${GAME_DB_USER}:${GAME_DB_PASSWORD}@game_db:5432/${GAME_DB_NAME}
      TOKEN_SECRET: ${TOKEN_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      game-db:
        condition: service_healthy
    profiles:
      - dev

  # Dev variant of the user service with hot-reload: `docker compose --profile dev up user-dev`.
  user-dev:
    # user: "${DEV_UID:-1000}:${DEV_GID:-1000}" # Set the user and group ID for development
    build:
      context: ./services/user
      target: dev
    container_name: user_dev
    image: user_dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TOKEN_SECRET: ${TOKEN_SECRET}
      REDIS_URL: redis://redis:6379
    volumes:
      - ./services/user:/app
      - user_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - dev

  # Dev variant with hot-reload: `docker compose --profile dev up web-dev`.
  # Not started by a plain `docker compose up` (profile-gated), since it
  # binds the same port 3000 as the `web` service.
  web-dev:
    # user: "${DEV_UID:-1000}:${DEV_GID:-1000}" # Set the user and group ID for development
    build:
      context: ./web
      target: dev
    container_name: web_dev
    image: web_dev
    environment:
      NUXT_USER_SERVICE_URL: http://user-dev:4000
      NUXT_GAME_SERVICE_URL: http://game-dev:5005
      NUXT_TOKEN_SECRET: ${TOKEN_SECRET}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      NUXT_REDIS_URL: redis://redis:6379
      # Bind-mounted source has no inotify events (e.g. over NFS), so make
      # chokidar-based watchers (Nuxt's builder) poll for changes instead.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      user-dev:
        condition: service_started
      game-dev:
        condition: service_started
      redis:
        condition: service_healthy
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local
  game_data:
    driver: local
  web_node_modules:
    driver: local
  user_node_modules:
    driver: local
